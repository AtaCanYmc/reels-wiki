[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reels-wiki"
version = "0.1.0"
description = "Local-first pipeline: saved Instagram Reels -> atomic notes in an Obsidian LLM Wiki vault."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "yt-dlp>=2025.1.1",
  "python-frontmatter>=1.1.0",
  "filelock>=3.13",
  "httpx>=0.27",
  "groq>=0.11",
  "google-genai>=1.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
reels-sync = "reels_wiki.cli:app"
reels-wiki-mcp = "reels_wiki.mcp_server:main"
reels-wiki-telegram = "reels_wiki.telegram_bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
