<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reels-wiki Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" width="18" height="18" />
      <h1>reels-wiki Capture</h1>
    </div>
    <span id="healthBadge" class="pill pill-idle">checking</span>
  </header>

  <label for="url">Instagram URL</label>
  <input id="url" type="url" placeholder="https://www.instagram.com/reel/..." />

  <label for="endpoint">Server Endpoint</label>
  <input id="endpoint" type="url" value="http://127.0.0.1:8765" />

  <label for="token">Bearer Token (optional)</label>
  <input id="token" type="password" placeholder="REELS_WIKI_HTTP_TOKEN" />

  <button id="saveBtn" type="button">Save to Queue</button>
  <button id="processBtn" type="button" class="btn-secondary">Process Queue Now</button>

  <section id="pendingBar" class="pending-bar" hidden>
    <span id="pendingCount">Offline queue: 0</span>
    <div class="pending-actions">
      <button id="syncBtn" type="button" class="btn-secondary">Sync</button>
      <button id="exportBtn" type="button" class="btn-secondary">Export JSON</button>
    </div>
  </section>

  <div id="status" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
