services:
  reels-process:
    build: .
    env_file:
      - .env
    environment:
      REELS_WIKI_CONFIG: /app/config.yaml
      REELS_WIKI_VAULT: /vault
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${VAULT_PATH:-./vault}:/vault
    security_opt:
      - no-new-privileges:true
    command: ["process", "--limit", "10"]

  reels-telegram:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REELS_WIKI_CONFIG: /app/config.yaml
      REELS_WIKI_VAULT: /vault
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${VAULT_PATH:-./vault}:/vault
    security_opt:
      - no-new-privileges:true
    command: ["telegram"]
